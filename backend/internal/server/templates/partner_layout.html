{{define "phead"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Vivant Partenaires</title>
<link rel="stylesheet" href="/static/partner.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="/partenaires">
      <svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#34D186"></rect><circle cx="24" cy="12" r="5" fill="#0F1113"></circle><path d="M11 21 L24 38 L37 21" fill="none" stroke="#0F1113" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>Vivant</span><span class="brand-tag">Partenaires</span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="/docs">Documentation</a>
      {{if .Partner}}
        <a href="/partenaires/tableau">Tableau de bord</a>
        <form method="post" action="/partenaires/deconnexion"><button class="linklike" type="submit">Déconnexion</button></form>
      {{else}}
        <a href="/partenaires/connexion">Connexion</a>
        <a class="btn btn-sm" href="/partenaires/inscription">Créer un compte</a>
      {{end}}
    </nav>
  </div>
</header>
<main>
{{end}}

{{define "pfoot"}}
</main>
<footer class="footer">
  <div class="wrap footer-in">
    <span>© Vivant · Identité numérique vérifiée</span>
    <span><a href="/docs">Documentation</a> · <a href="/.well-known/openid-configuration">OpenID Connect</a></span>
  </div>
</footer>
<script src="/static/partner.js"></script>
</body>
</html>
{{end}}

{{define "copy"}}<button class="copy" type="button" data-copy="{{.}}" aria-label="Copier">Copier</button>{{end}}
